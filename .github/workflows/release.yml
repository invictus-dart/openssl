name: release

# Builds static OpenSSL bundles for a fixed set of targets and publishes them
# as one release per OpenSSL version: tag openssl-3.5.9 becomes release tag
# v3.5.9, titled "OpenSSL v3.5.9", holding openssl-3.5.9-<suffix>.tar.gz.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: OpenSSL tag to build
        required: true
        type: string
        default: openssl-3.5.9

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
          - target: linux-x86
            apt: gcc-multilib
          - target: linux-aarch64
            apt: gcc-aarch64-linux-gnu
          - target: linux-armv4
            apt: gcc-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - run: |
          chmod +x ci/scripts/build.sh
          SRC_DIR="$PWD/src" OUT_DIR="$PWD/out" \
            ci/scripts/build.sh "${TAG}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error

  # Cross-compiled on Linux because the NDK ships native linux-x86_64 host tools.
  android:
    runs-on: ubuntu-latest
    env:
      NDK: android-ndk-r28c
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64, android-arm, android-x86_64, android-x86]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - name: Install NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/${NDK}-linux.zip"
          unzip -q ndk.zip
          echo "$PWD/${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: |
          chmod +x ci/scripts/build.sh
          SRC_DIR="$PWD/src" OUT_DIR="$PWD/out" \
            ci/scripts/build.sh "${TAG}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One floor per platform, set here rather than taken from a consumer:
          # iOS 12.0, macOS 10.15. The two arm64 slices cannot be built that low,
          # so clang raises them (11.0 and 14.0) and LC_BUILD_VERSION shows that.
          - target: darwin64-arm64
            min: -mmacos-version-min=10.15
          - target: darwin64-x86_64
            min: -mmacos-version-min=10.15
          - target: ios64-xcrun
            min: -mios-version-min=12.0
          - target: iossimulator-arm64-xcrun
            min: -mios-simulator-version-min=12.0
          - target: iossimulator-x86_64-xcrun
            min: -mios-simulator-version-min=12.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - run: |
          chmod +x ci/scripts/build.sh
          SRC_DIR="$PWD/src" OUT_DIR="$PWD/out" \
            ci/scripts/build.sh "${TAG}" "${{ matrix.target }}" "${{ matrix.min }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: VC-WIN64A
            runner: windows-latest
            nasm: x64
          - target: VC-WIN32
            runner: windows-latest
            nasm: x86

          # windows-2022 carries no ARM64 MSVC toolset. VC-WIN64-ARM has no
          # asm_arch, so Configure disables asm and NASM is not needed here.
          - target: VC-WIN64-ARM
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - name: Install Strawberry Perl if missing
        shell: pwsh
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install strawberryperl -y
          }

      - name: Install NASM
        if: matrix.nasm
        shell: pwsh
        run: |
          $arch = '${{ matrix.nasm }}'
          $win = if ($arch -eq 'x86') { 'win32' } else { 'win64' }
          $dir = if ($arch -eq 'x86') { 'C:\Program Files (x86)\NASM' } else { 'C:\Program Files\NASM' }
          $installer = "nasm-3.01-installer-$arch.exe"
          Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/3.01/$win/$installer" -OutFile $installer
          Start-Process -FilePath ".\$installer" -ArgumentList '/S' -Wait
          $dir | Out-File $env:GITHUB_PATH -Append

      - name: Install jom
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\jom | Out-Null
          Invoke-WebRequest -Uri "https://download.qt.io/official_releases/jom/jom_1_1_7.zip" -OutFile C:\jom\jom.zip
          Expand-Archive -Path C:\jom\jom.zip -DestinationPath C:\jom -Force
          "C:\jom" | Out-File $env:GITHUB_PATH -Append

      - name: Build bundle
        shell: pwsh
        run: |
          .\ci\scripts\build.ps1 -Tag $env:TAG -Target '${{ matrix.target }}' `
            -SrcDir "$PWD\src" -OutDir "$PWD\out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [linux, android, apple, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout in this job, so gh cannot infer the repository from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: cd dist && sha256sum openssl-*.tar.gz > SHA256SUMS

      - name: Publish release
        run: |
          release="v${TAG#openssl-}"
          if gh release view "$release" >/dev/null 2>&1; then
            gh release upload "$release" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$release" dist/*.tar.gz dist/SHA256SUMS \
              --title "OpenSSL $release" \
              --notes "Static libcrypto and libssl bundles for every target listed in README.md."
          fi
